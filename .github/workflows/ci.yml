name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dsh: ['0.2.0-rc.2', '0.2.1-alpha.1', '0.2.1-rc.2', '0.2.1-rc.3']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Use the verified npm version
        run: npm install --global npm@11.6.1
      - run: npm ci
        if: matrix.dsh == '0.2.0-rc.2'
      - name: Install the tested DSH host libraries
        if: matrix.dsh == '0.2.1-alpha.1'
        run: |
          npm pkg set "devDependencies.@deepseek-ai/cordis=4.0.5-alpha.1" "devDependencies.@deepseek-ai/dsh-app-boot=0.2.1-alpha.1" "devDependencies.@deepseek-ai/dsh-llm=0.2.1-alpha.1" "devDependencies.@deepseek-ai/dsh-subprocess=0.2.1-alpha.1" "devDependencies.@deepseek-ai/dsh-subprocess-local=0.2.1-alpha.1"
          npm pkg set "devDependencies.@deepseek-ai/cordis-plugin-group=1.0.5-alpha.1" "devDependencies.@deepseek-ai/cordis-plugin-loader=1.0.6-alpha.1" "devDependencies.@deepseek-ai/cordis-plugin-include=1.0.10-alpha.1"
          node -e "require('node:fs').unlinkSync('package-lock.json')"
          npm install
      - name: Install the release-candidate DSH host libraries
        if: matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: |
          npm pkg set "devDependencies.@deepseek-ai/cordis=4.0.5" "devDependencies.@deepseek-ai/dsh-app-boot=${{ matrix.dsh }}" "devDependencies.@deepseek-ai/dsh-llm=${{ matrix.dsh }}" "devDependencies.@deepseek-ai/dsh-subprocess=${{ matrix.dsh }}" "devDependencies.@deepseek-ai/dsh-subprocess-local=${{ matrix.dsh }}"
          node -e "require('node:fs').unlinkSync('package-lock.json')"
          npm install
      - run: npm run check
      - run: npm run format:check
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
